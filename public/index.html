<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Xanjo-World</title>
  <style>
    :root {
      --panel: rgba(20, 24, 34, 0.82);
      --accent: #7ee0a3;
      --danger: #ff6b6b;
      --text: #eef2f7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #14161f; font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text);
    }
    #game-container { position: fixed; inset: 0; }
    #game-container canvas { image-rendering: pixelated; }

    /* ---------- Login overlay ---------- */
    #login {
      position: fixed; inset: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 35%, #1d2b3a 0%, #0d1117 70%);
    }
    #login .card {
      background: var(--panel); border: 1px solid #2b3245; border-radius: 14px;
      padding: 34px 38px; width: min(92vw, 400px); text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.5);
    }
    #login h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: .5px; }
    #login h1 span { color: var(--accent); }
    #login p { margin: 0 0 22px; color: #9fb0c3; font-size: 13px; }
    #login input {
      width: 100%; padding: 12px 14px; border-radius: 9px; border: 1px solid #333c52;
      background: #0e1219; color: var(--text); font-size: 15px; outline: none;
    }
    #login input:focus { border-color: var(--accent); }
    #login button {
      width: 100%; margin-top: 14px; padding: 13px; border: none; border-radius: 9px;
      background: linear-gradient(180deg, #5fd68b, #37a35f); color: #06120a;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    #login button:hover { filter: brightness(1.08); }
    #login .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }

    /* ---------- HUD ---------- */
    #hud { position: fixed; top: 14px; left: 14px; z-index: 20; pointer-events: none; }
    #hud .box {
      background: var(--panel); border: 1px solid #2b3245; border-radius: 10px;
      padding: 10px 14px; min-width: 220px; backdrop-filter: blur(4px);
    }
    #hud .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    #hud .name { font-weight: 700; font-size: 15px; }
    #hud .lvl { color: #ffd76e; font-weight: 700; }
    .bar { height: 9px; border-radius: 6px; background: #0e1219; overflow: hidden; margin: 5px 0; border: 1px solid #2b3245; }
    .bar > div { height: 100%; border-radius: 6px; transition: width .15s ease; }
    #hpFill { background: linear-gradient(90deg, #ff8f8f, #e64545); }
    #xpFill { background: linear-gradient(90deg, #8fd0ff, #4d8dff); }
    #hud .stat { color: #9fb0c3; font-size: 12px; margin-top: 4px; }

    #topright { position: fixed; top: 14px; right: 14px; z-index: 20; pointer-events: none;
      background: var(--panel); border: 1px solid #2b3245; border-radius: 10px; padding: 8px 14px; font-size: 12px; color: #9fb0c3; }
    #topright b { color: var(--text); }

    #hint { position: fixed; bottom: 14px; right: 14px; z-index: 20; pointer-events: none;
      background: var(--panel); border: 1px solid #2b3245; border-radius: 8px; padding: 8px 12px;
      font-size: 11.5px; color: #9fb0c3; line-height: 1.5; }

    /* ---------- Chat ---------- */
    #chat {
      position: fixed; left: 14px; bottom: 14px; z-index: 20; width: min(92vw, 380px);
      display: flex; flex-direction: column; gap: 8px;
    }
    #chatLog {
      height: 170px; overflow-y: auto; background: var(--panel); border: 1px solid #2b3245;
      border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45;
    }
    #chatLog .sys { color: #ffd76e; }
    #chatLog .me { color: var(--accent); }
    #chatLog .who { color: #8fb6ff; }
    #chatInput {
      width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid #333c52;
      background: var(--panel); color: var(--text); font-size: 13px; outline: none;
    }
    #chatInput:focus { border-color: var(--accent); }

    /* ---------- Death overlay ---------- */
    #death {
      position: fixed; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center; flex-direction: column;
      background: rgba(60, 0, 0, 0.45); text-align: center;
    }
    #death h2 { font-size: 42px; margin: 0; color: #ff9d9d; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
    #death p { color: #ffd7d7; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Login -->
  <div id="login">
    <div class="card">
      <h1>Xanjo<span>-World</span></h1>
      <p>A browser MMO built with Phaser 3 + Node.js + WebSockets.<br/>Walk with WASD · Space or click a monster to attack.</p>
      <input id="nameInput" maxlength="16" placeholder="Enter your hero name" autocomplete="off" />
      <button id="playBtn">Enter World</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" style="display:none">
    <div class="box">
      <div class="row">
        <span class="name" id="hudName">—</span>
        <span class="lvl" id="hudLvl">Lv 1</span>
      </div>
      <div class="bar"><div id="hpFill" style="width:100%"></div></div>
      <div class="bar"><div id="xpFill" style="width:0%"></div></div>
      <div class="stat">HP <b id="hpText">100/100</b> · XP <b id="xpText">0/100</b> · Kills <b id="killText">0</b></div>
    </div>
  </div>

  <div id="topright">Online: <b id="onlineCount">0</b></div>

  <div id="chat">
    <div id="chatLog"></div>
    <input id="chatInput" placeholder="Press Enter to chat…" maxlength="200" autocomplete="off" />
  </div>

  <div id="hint">
    WASD / arrows — move<br/>
    SPACE — attack nearest monster<br/>
    Click monster — attack it
  </div>

  <div id="death">
    <h2>You died</h2>
    <p>Respawning at the village…</p>
  </div>

  <script src="/phaser.min.js"></script>
  <script src="/game.js"></script>
</body>
</html>
